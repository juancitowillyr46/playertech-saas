<label style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #555555;">Celular *</span><input style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #BDBDBD; border-radius: 8px; font-size: 14px;" value="315 777 9876"></label>

<button style="height: 44px; border: 2px solid #333333; border-radius: 8px; background: #E6E6E6; color: #222222; font-weight: 600;">✓ Papá</button>
